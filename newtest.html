<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>语义启动效应实验 (Semantic Priming Paradigm)</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden; user-select: none;
        }
        #experiment-container {
            text-align: center; max-width: 800px; width: 100%;
        }
        .screen { display: none; font-size: 24px; line-height: 1.6; }
        .screen.active { display: block; }
        
        /* 刺激呈现的样式 */
        #stimulus-box { font-size: 80px; font-weight: bold; letter-spacing: 5px;}
        
        .btn {
            padding: 12px 24px; font-size: 18px; cursor: pointer;
            background-color: #2c3e50; color: white; border: none;
            border-radius: 6px; margin-top: 30px; transition: 0.2s;
        }
        .btn:hover { background-color: #1a252f; }
        
        .key-hint { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

<div id="experiment-container">
    <div id="screen-instructions" class="screen active">
        <h2>词汇判断实验</h2>
        <p>欢迎参加本次心理学实验。</p>
        <p>在接下来的任务中，屏幕中央会先出现一个“+”号。<br>
        随后会快速闪过一个词，接着出现一个<b>目标词</b>。</p>
        <p>你需要尽快、准确地判断这个<b>目标词</b>是否是一个<b>真实的中文词语</b>：</p>
        <p>如果是真词，请按键盘上的 <span class="key-hint">F 键</span></p>
        <p>如果是假词，请按键盘上的 <span class="key-hint">J 键</span></p>
        <p>请将你的左手食指放在 F 键上，右手食指放在 J 键上。<br>准备好后，请按<b>空格键 (Space)</b> 开始实验。</p>
    </div>

    <div id="screen-trial" class="screen">
        <div id="stimulus-box"></div>
    </div>

    <div id="screen-end" class="screen">
        <h2>实验结束</h2>
        <p>感谢您的参与！您的反应数据已记录。</p>
        <button class="btn" onclick="exportData()">⬇️ 导出 CSV 数据</button>
    </div>
</div>

<script>
    // --- 实验材料与设计 ---
    // condition: 实验条件 (related=相关, unrelated=不相关, nonword=假词)
    // prime: 启动词; target: 目标词; correct_key: 正确按键 ('f'=真词, 'j'=假词)
    const trials = [
        { condition: 'related', prime: '医生', target: '护士', correct_key: 'f' },
        { condition: 'unrelated', prime: '苹果', target: '汽车', correct_key: 'f' },
        { condition: 'related', prime: '天空', target: '云朵', correct_key: 'f' },
        { condition: 'unrelated', prime: '桌子', target: '河流', correct_key: 'f' },
        { condition: 'nonword', prime: '森林', target: '跑明', correct_key: 'j' },
        { condition: 'nonword', prime: '衣服', target: '电绿', correct_key: 'j' }
    ];

    // 打乱试次顺序 (Fisher-Yates Shuffle)
    trials.sort(() => Math.random() - 0.5);

    // --- 实验参数 (单位：毫秒) ---
    const TIMING = {
        fixation: 500,  // 注视点 "+" 时长
        prime: 150,     // 启动词呈现时长
        blank: 50       // 空屏时长 (SOA = prime + blank = 200ms)
    };

    // --- 全局变量 ---
    let currentTrialIndex = 0;
    let experimentData = [];
    let targetStartTime = 0;
    let isWaitingForResponse = false;
    let currentPhase = 'instructions'; // instructions, trial, end

    // DOM 元素
    const screenInstructions = document.getElementById('screen-instructions');
    const screenTrial = document.getElementById('screen-trial');
    const screenEnd = document.getElementById('screen-end');
    const stimulusBox = document.getElementById('stimulus-box');

    // --- 键盘事件监听 ---
    document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();

        // 在指导语界面按空格键开始
        if (currentPhase === 'instructions' && key === ' ') {
            currentPhase = 'trial';
            screenInstructions.classList.remove('active');
            screenTrial.classList.add('active');
            setTimeout(runNextTrial, 1000); // 缓冲1秒后开始第一个trial
            return;
        }

        // 在 trial 界面等待按键 (仅接受 f 或 j)
        if (currentPhase === 'trial' && isWaitingForResponse && (key === 'f' || key === 'j')) {
            isWaitingForResponse = false; // 防止连按重复记录
            const responseTime = performance.now(); // 获取高精度反应时间
            recordResponse(key, responseTime);
        }
    });

    // --- 运行单个试次 (Trial Sequence) ---
    function runNextTrial() {
        if (currentTrialIndex >= trials.length) {
            endExperiment();
            return;
        }

        const trial = trials[currentTrialIndex];
        
        // 步骤 1: 呈现注视点 "+"
        stimulusBox.innerText = "+";
        
        setTimeout(() => {
            // 步骤 2: 呈现启动词 (Prime)
            stimulusBox.innerText = trial.prime;
            
            setTimeout(() => {
                // 步骤 3: 掩蔽/空屏 (Blank)
                stimulusBox.innerText = "";
                
                setTimeout(() => {
                    // 步骤 4: 呈现目标词 (Target) 并开始计时
                    stimulusBox.innerText = trial.target;
                    targetStartTime = performance.now();
                    isWaitingForResponse = true; // 开启按键接收
                    
                }, TIMING.blank);
            }, TIMING.prime);
        }, TIMING.fixation);
    }

    // --- 记录数据 ---
    function recordResponse(pressedKey, responseTimeStr) {
        const trial = trials[currentTrialIndex];
        const rt = responseTimeStr - targetStartTime; // 计算反应时 (ms)
        const isCorrect = (pressedKey === trial.correct_key); // 判断对错

        experimentData.push({
            trial_index: currentTrialIndex + 1,
            condition: trial.condition,
            prime: trial.prime,
            target: trial.target,
            expected_key: trial.correct_key,
            pressed_key: pressedKey,
            accuracy: isCorrect ? 1 : 0,
            rt: rt.toFixed(2) // 保留两位小数
        });

        stimulusBox.innerText = ""; // 按键后立即清空屏幕
        currentTrialIndex++;
        
        // 步骤 5: 试次间隔 (ITI - Inter-Trial Interval)，设定为 1000ms 后进入下一轮
        setTimeout(runNextTrial, 1000);
    }

    // --- 结束实验 ---
    function endExperiment() {
        currentPhase = 'end';
        screenTrial.classList.remove('active');
        screenEnd.classList.add('active');
    }

    // --- 导出 CSV 功能 ---
    function exportData() {
        // 定义 CSV 表头
        let csvContent = "Trial,Condition,Prime,Target,Expected_Key,Pressed_Key,Accuracy,RT_ms\n";
        
        // 写入数据
        experimentData.forEach(row => {
            csvContent += `${row.trial_index},${row.condition},${row.prime},${row.target},${row.expected_key},${row.pressed_key},${row.accuracy},${row.rt}\n`;
        });

        // 加上 BOM 头以兼容 Excel 的 UTF-8 中文显示
        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
        
        // 创建下载链接
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `priming_data_${Date.now()}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
